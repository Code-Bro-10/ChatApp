services:
  mongodb:
    image: mongo:7
    container_name: chatsphere-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - chatsphere_mongo_data:/data/db
  redis:
    image: redis:7-alpine
    container_name: chatsphere-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - chatsphere_redis_data:/data
volumes:
  chatsphere_mongo_data:
  chatsphere_redis_data:
